<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday 🎂</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Caveat:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════
   🎨 GLOBAL RESET & BASE STYLES
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif}
body{background:#0d0620;display:flex;align-items:center;justify-content:center}
#root{width:100%;height:100%;max-width:460px;position:relative;overflow:hidden;background:#0d0620}
@media(min-width:500px){#root{height:900px;max-height:96vh;border-radius:38px;box-shadow:0 40px 120px rgba(120,60,200,.35),0 0 0 1px rgba(255,255,255,.06)}}

/* ═══════════════════════════════════════════════════════════
   ✨ ANIMATIONS
   ═══════════════════════════════════════════════════════════ */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes balloonUp{0%{transform:translateY(120vh) scale(.7);opacity:0}10%{opacity:.9}90%{opacity:.85}100%{transform:translateY(-130vh) scale(1);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1.3)}}
@keyframes flicker{0%,100%{transform:scaleY(1) scaleX(1);opacity:1}50%{transform:scaleY(1.15) scaleX(.9);opacity:.85}}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(900deg);opacity:0}}
@keyframes smokeUp{0%{opacity:.7;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-40px) scale(2)}}
@keyframes rippleOut{0%{transform:scale(0);opacity:.7}100%{transform:scale(4);opacity:0}}
@keyframes heartBeat{0%,70%,100%{transform:scale(1)}20%{transform:scale(1.25)}40%{transform:scale(1)}60%{transform:scale(1.15)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

@keyframes celebratePop{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(180,100,255,.7)}
  40%{transform:scale(1.35) rotate(-6deg);box-shadow:0 0 0 12px rgba(180,100,255,.4),0 0 40px 20px rgba(236,72,153,.6)}
  70%{transform:scale(1.5) rotate(6deg);box-shadow:0 0 0 20px rgba(180,100,255,.2),0 0 60px 30px rgba(236,72,153,.4)}
  100%{transform:scale(1.2) rotate(0);box-shadow:0 0 0 30px rgba(180,100,255,0),0 0 80px 40px rgba(236,72,153,0)}
}
@keyframes sparkleBurst{0%{transform:translate(0,0) scale(0);opacity:1}50%{transform:translate(var(--sx),var(--sy)) scale(1.4);opacity:1}100%{transform:translate(var(--sx),var(--sy)) scale(0);opacity:0}}
@keyframes ringExpand{0%{transform:scale(.5);opacity:1;border-width:6px}100%{transform:scale(2.8);opacity:0;border-width:1px}}
@keyframes bgFlash{0%{opacity:0}30%{opacity:.6}100%{opacity:0}}
@keyframes floatUpFade{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-200px) scale(1.4);opacity:0}}
@keyframes giftPop{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.08) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}75%{transform:scale(1.05) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes giftEmojiBurst{0%{transform:translate(0,0) scale(0) rotate(0);opacity:0}30%{opacity:1}100%{transform:translate(var(--ex),var(--ey)) scale(1.6) rotate(var(--er));opacity:0}}
@keyframes modalIn{0%{opacity:0;transform:scale(.85) translateY(30px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes overlayIn{from{opacity:0;backdrop-filter:blur(0px)}to{opacity:1;backdrop-filter:blur(6px)}}
@keyframes lockPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 20px rgba(168,85,247,.5))}50%{transform:scale(1.08);filter:drop-shadow(0 0 40px rgba(236,72,153,.7))}}
@keyframes welcomeGlow{0%,100%{text-shadow:0 0 20px rgba(250,204,21,.6)}50%{text-shadow:0 0 40px rgba(250,204,21,.9),0 0 80px rgba(236,72,153,.7)}}
@keyframes doorOpen{0%{opacity:0;transform:perspective(800px) rotateY(-90deg)}100%{opacity:1;transform:perspective(800px) rotateY(0)}}
@keyframes sparkleRain{0%{transform:translateY(-100vh) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes inputShake{0%,100%{transform:translateX(0)}15%,45%,75%{transform:translateX(-10px)}30%,60%,90%{transform:translateX(10px)}}
@keyframes welcomeZoom{0%{transform:scale(0) rotate(-180deg);opacity:0}60%{transform:scale(1.2) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes qrModalIn{0%{opacity:0;transform:scale(.5) translateY(40px) rotate(-8deg)}60%{transform:scale(1.05) translateY(-5px) rotate(3deg)}100%{opacity:1;transform:scale(1) translateY(0) rotate(0)}}
@keyframes qrBorderSpin{to{transform:rotate(360deg)}}
@keyframes qrPulse{0%,100%{box-shadow:0 0 40px rgba(168,85,247,.6),0 0 80px rgba(236,72,153,.4)}50%{box-shadow:0 0 60px rgba(236,72,153,.8),0 0 120px rgba(168,85,247,.6)}}
@keyframes memoryPop{0%{opacity:0;transform:scale(.8) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes musicIndicator{0%,100%{transform:scaleY(1);opacity:.9}50%{transform:scaleY(1.8);opacity:1}}

.gift-card.celebrating{animation:giftPop 1.1s cubic-bezier(.34,1.56,.64,1) forwards}
.gift-emoji-burst{position:absolute;font-size:26px;pointer-events:none;left:50%;top:50%;animation:giftEmojiBurst 1.1s ease-out forwards;z-index:50}
.anim-fadeUp{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}
.anim-pop{animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
.anim-float{animation:floatY 4s ease-in-out infinite}
.anim-heartBeat{animation:heartBeat 1.4s ease-in-out infinite}
.celebrate-pop{animation:celebratePop 1s cubic-bezier(.34,1.56,.64,1) forwards !important}
.celebrate-ring{position:absolute;inset:0;border:6px solid #ec4899;border-radius:16px;pointer-events:none;animation:ringExpand .9s ease-out forwards}
.celebrate-sparkle{position:absolute;top:50%;left:50%;font-size:20px;pointer-events:none;animation:sparkleBurst .9s ease-out forwards;z-index:50}
.celebration-overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,215,80,.8),rgba(236,72,153,.5) 40%,transparent 70%);pointer-events:none;z-index:9999;animation:bgFlash 1s ease-out forwards}
.celebration-emoji{position:fixed;font-size:36px;pointer-events:none;z-index:10000;animation:floatUpFade 1s ease-out forwards}

/* ═══════════════════════════════════════════════════════════
   🏗️  LAYOUT
   ═══════════════════════════════════════════════════════════ */
.app{position:absolute;inset:0;overflow:hidden}
.bg-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
.balloon{position:absolute;bottom:-140px;animation:balloonUp linear infinite;pointer-events:none}
.balloon svg{filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.page-container{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 26px;z-index:5;text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page-container::-webkit-scrollbar{display:none}
.last-page{position:absolute;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:44px 20px 60px;text-align:center;background:linear-gradient(160deg,#fdf1ff 0%,#f8e6ff 50%,#ffe9f2 100%)}
.last-page::-webkit-scrollbar{display:none}
.last-page-inner{max-width:360px;margin:0 auto;position:relative;z-index:2}
.script{font-family:'Dancing Script',cursive;font-weight:700;line-height:1.15}
.hand{font-family:'Caveat',cursive;font-weight:500;line-height:1.4}

.music-indicator{position:absolute;top:14px;right:14px;display:flex;gap:3px;align-items:flex-end;height:16px;z-index:500;pointer-events:none;opacity:.85}
.music-bar{width:3px;background:linear-gradient(180deg,#a855f7,#ec4899);border-radius:2px;animation:musicIndicator .6s ease-in-out infinite}
.music-bar:nth-child(1){height:60%;animation-delay:0s}
.music-bar:nth-child(2){height:100%;animation-delay:.15s}
.music-bar:nth-child(3){height:70%;animation-delay:.3s}
.music-bar:nth-child(4){height:90%;animation-delay:.45s}

/* ═══════════════════════════════════════════════════════════
   🔘 BUTTONS
   ═══════════════════════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 32px;border-radius:50px;border:none;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;letter-spacing:.3px;cursor:pointer;position:relative;overflow:hidden;transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s;user-select:none}
.btn:active{transform:scale(.96);transition-duration:.08s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn-gradient{background:linear-gradient(135deg,#a855f7 0%,#ec4899 50%,#f97316 100%);color:#fff;box-shadow:0 8px 28px rgba(168,85,247,.45)}
.btn-purple{background:linear-gradient(135deg,#8b5cf6,#a855f7);color:#fff;box-shadow:0 8px 24px rgba(139,92,246,.45)}
.btn-pink{background:linear-gradient(135deg,#ec4899,#f97316);color:#fff;box-shadow:0 8px 24px rgba(236,72,153,.5)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);pointer-events:none;animation:rippleOut .7s ease-out forwards}

/* ═══════════════════════════════════════════════════════════
   💬 MESSAGE CARD
   ═══════════════════════════════════════════════════════════ */
.msg-card{background:#fff;border-radius:18px;padding:20px 22px;display:flex;gap:14px;align-items:flex-start;text-align:left;box-shadow:0 8px 24px rgba(120,60,200,.12),0 2px 6px rgba(0,0,0,.04);border:1px solid rgba(200,160,255,.15);transition:transform .25s}
.msg-card:hover{transform:translateY(-3px)}
.msg-icon{font-size:26px;line-height:1;flex-shrink:0}
.msg-text{font-size:15px;color:#3a2a5c;font-weight:600;line-height:1.55}

/* ═══════════════════════════════════════════════════════════
   🎂 CAKE & CANDLE
   ═══════════════════════════════════════════════════════════ */
.cake-image-wrap{position:relative;width:100%;max-width:340px;margin:0 auto 26px;cursor:pointer;display:block}
.cake-image-wrap img{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 15px 40px rgba(0,0,0,.5)}
.flame-position{position:absolute;left:47%;top:4%;transform:translate(-50%,-100%);cursor:pointer;pointer-events:auto;z-index:10;transition:transform .2s}
.flame-position:active{transform:translate(-50%,-100%) scale(.9)}
.real-flame{width:18px;height:32px;background:radial-gradient(ellipse at 50% 80%,#ffffff 0%,#fffbeb 20%,#fde047 50%,#f97316 80%,#dc2626 100%);border-radius:50% 50% 20% 20%/60% 60% 40% 40%;box-shadow:0 0 15px rgba(253,224,71,.9),0 0 30px rgba(249,115,22,.6),0 0 45px rgba(220,38,38,.4);animation:flicker .15s infinite alternate;transform-origin:center bottom;position:relative}
.real-flame::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:3px;height:6px;background:#333;border-radius:1px;z-index:-1}
.flame-glow{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.4),transparent 70%);pointer-events:none}
.candle-smoke-small{width:12px;height:12px;border-radius:50%;background:rgba(220,220,220,.7);animation:smokeUp 1.4s ease-out forwards;pointer-events:none;position:absolute;bottom:0;left:50%;transform:translateX(-50%)}

/* ═══════════════════════════════════════════════════════════
   📸 MEMORIES
   ═══════════════════════════════════════════════════════════ */
.mem-frame{width:100%;max-width:320px;aspect-ratio:1/1;border-radius:22px;padding:4px;background:linear-gradient(135deg,#f0abfc,#c084fc,#a855f7,#ec4899);box-shadow:0 14px 42px rgba(168,85,247,.35);position:relative;overflow:hidden;cursor:pointer;margin:0 auto}
.mem-frame-inner{width:100%;height:100%;border-radius:18px;overflow:hidden;background:#f3e8ff;position:relative}
.mem-img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .4s}
.mem-dots{display:flex;gap:8px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.mem-dot{width:9px;height:9px;border-radius:50%;background:#d8b4fe;transition:all .3s;border:none;cursor:pointer;padding:0}
.mem-dot.active{width:26px;border-radius:5px;background:linear-gradient(90deg,#a855f7,#ec4899)}
.mem-hint{font-size:11px;color:#a855f7;font-weight:700;letter-spacing:.5px;margin-top:8px;opacity:.75}
.fullscreen-viewer{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:20000;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pinch-zoom}
.fullscreen-viewer img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .1s;user-select:none;-webkit-user-drag:none}
.fs-close{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);z-index:20001}
.fs-controls{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:10px;background:rgba(255,255,255,.1);padding:10px 16px;border-radius:50px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);z-index:20001}
.fs-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800}
.fs-btn:active{transform:scale(.9)}
.fs-hint{position:absolute;top:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-size:12px;font-weight:700;letter-spacing:1px;background:rgba(0,0,0,.4);padding:6px 16px;border-radius:50px}

/* ═══════════════════════════════════════════════════════════
   💌 LETTER
   ═══════════════════════════════════════════════════════════ */
.letter{width:100%;max-width:340px;background:linear-gradient(180deg,#fffef7 0%,#fff8e7 100%);border-radius:18px;padding:28px 24px;box-shadow:0 20px 50px rgba(180,140,80,.25),0 4px 12px rgba(0,0,0,.06);position:relative;text-align:left;border:1px solid rgba(220,200,160,.4);background-image:repeating-linear-gradient(180deg,transparent 0 34px,rgba(200,180,150,.18) 34px 35px);background-position:0 22px;margin:0 auto}
.letter-stamp{position:absolute;top:16px;right:16px;width:44px;height:52px;border-radius:6px;background:#fff;border:2px dashed #f4a6c0;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.06);transform:rotate(6deg)}
.letter-bear{width:64px;height:64px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:48px;filter:drop-shadow(0 4px 8px rgba(180,140,80,.3))}
.letter-greet{font-family:'Dancing Script',cursive;font-weight:700;font-size:26px;color:#a0522d;margin-bottom:14px;text-align:center}
.letter-body{font-family:'Caveat',cursive;font-size:20px;line-height:1.55;color:#4a3a2a;font-weight:500}
.letter-sign{font-family:'Caveat',cursive;font-size:22px;color:#b45309;text-align:right;margin-top:22px;font-weight:600}

/* ═══════════════════════════════════════════════════════════
   🎁 GIFTS
   ═══════════════════════════════════════════════════════════ */
.gift-card{width:100%;border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:14px;color:#fff;text-align:left;box-shadow:0 8px 22px rgba(0,0,0,.15);transition:transform .25s;cursor:pointer;position:relative;overflow:hidden}
.gift-card:hover{transform:translateY(-4px) scale(1.02)}
.gift-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.gift-info{flex:1}
.gift-title{font-size:15px;font-weight:800;margin-bottom:2px}
.gift-sub{font-size:12px;opacity:.85;font-weight:500}
.gift-tap-hint{font-size:9px;opacity:.7;font-weight:700;letter-spacing:.5px;margin-top:3px;text-transform:uppercase}
.gift-modal-overlay{position:fixed;inset:0;z-index:25000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(13,6,32,.7);animation:overlayIn .3s ease-out forwards}
.gift-modal{background:linear-gradient(160deg,#fffefb 0%,#fdf1ff 100%);border-radius:24px;padding:28px 22px 24px;width:100%;max-width:340px;text-align:center;position:relative;box-shadow:0 30px 80px rgba(168,85,247,.4),0 0 0 1px rgba(255,255,255,.6);animation:modalIn .45s cubic-bezier(.34,1.56,.64,1) forwards}
.gift-modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(168,85,247,.12);color:#a855f7;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gift-modal-emoji{font-size:58px;line-height:1;margin-bottom:8px;display:block;animation:floatY 3s ease-in-out infinite}
.gift-modal-title{font-family:'Dancing Script',cursive;font-size:26px;font-weight:700;color:#a21caf;margin-bottom:4px}
.gift-modal-sub{font-size:12px;color:#7c3aed;font-weight:700;margin-bottom:6px}
.gift-modal-question{font-size:13px;color:#4a3a5c;font-weight:700;margin:14px 0 16px;line-height:1.5}
.gift-modal-btns{display:flex;flex-direction:column;gap:10px}
.gift-send-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border-radius:14px;border:none;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer;color:#fff;transition:transform .18s,box-shadow .18s;letter-spacing:.3px}
.gift-send-btn:active{transform:scale(.97)}
.gift-send-btn:hover{transform:translateY(-2px)}
.gift-send-wa{background:linear-gradient(135deg,#25D366,#128C7E);box-shadow:0 8px 22px rgba(37,211,102,.45)}
.gift-send-mail{background:linear-gradient(135deg,#a855f7,#ec4899);box-shadow:0 8px 22px rgba(168,85,247,.45)}
.gift-send-icon{font-size:20px}
.gift-modal-note{font-size:10.5px;color:#a89580;font-weight:700;margin-top:14px;letter-spacing:.3px}

/* ═══════════════════════════════════════════════════════════
   📱 QR MODAL
   ═══════════════════════════════════════════════════════════ */
.qr-modal-overlay{position:fixed;inset:0;z-index:26000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(13,6,32,.88);animation:overlayIn .35s ease-out forwards}
.qr-modal{position:relative;width:100%;max-width:340px;background:linear-gradient(160deg,#fffefb 0%,#fdf1ff 60%,#ffe9f2 100%);border-radius:28px;padding:32px 22px 26px;text-align:center;box-shadow:0 30px 80px rgba(168,85,247,.5),0 0 0 1px rgba(255,255,255,.6),inset 0 0 60px rgba(168,85,247,.06);animation:qrModalIn .55s cubic-bezier(.34,1.56,.64,1) forwards;overflow:hidden}
.qr-modal::before{content:'';position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;border-radius:30px;padding:2px;background:conic-gradient(from 0deg,#a855f7,#ec4899,#f97316,#fde047,#a855f7);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:qrBorderSpin 4s linear infinite;pointer-events:none;opacity:.85}
.qr-modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(168,85,247,.15);color:#a855f7;font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;transition:transform .2s,background .2s}
.qr-modal-close:hover{background:rgba(236,72,153,.25);color:#ec4899;transform:rotate(90deg)}
.qr-modal-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#a855f7;background:rgba(168,85,247,.12);padding:6px 14px;border-radius:50px;margin-bottom:14px}

  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain); gain.connect(ctx.destination);
    const t = ctx.currentTime + delay;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + .02);
    gain.gain.setValueAtTime(vol, t + dur * .7);
    gain.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.start(t); osc.stop(t + dur + .05);
  } catch (e) {}
};

const DB_NAME = 'BirthdaySharedMemories';
const DB_VERSION = 1;
const STORE_NAME = 'memories';

let _idbReason = '';

const checkIDB = async () => {
  if (_idbAvailable !== null) return _idbAvailable;
  try {
    if (typeof window === 'undefined' || !window.indexedDB) {
      _idbAvailable = false;
      _idbReason = 'IndexedDB not supported in this browser';
      return false;
    }
    if (window.location.protocol === 'file:') {
      _idbAvailable = false;
      _idbReason = 'Page is opened via file:// — IndexedDB blocked by browser security. Open via http:// or https:// to enable permanent storage.';
      return false;
    }
    const test = await new Promise((resolve, reject) => {
      const req = indexedDB.open('__bdaytest__', 1);
      req.onsuccess = () => {
        try { req.result.close(); } catch (e) {}
        try { indexedDB.deleteDatabase('__bdaytest__'); } catch (e) {}
        resolve(true);
      };
      req.onerror = () => reject(req.error || new Error('IndexedDB blocked'));
      req.onblocked = () => reject(new Error('IndexedDB blocked'));
      setTimeout(() => reject(new Error('IndexedDB timeout')), 2500);
    });
    _idbAvailable = test === true;
    if (!_idbAvailable) _idbReason = 'IndexedDB access denied';
  } catch (e) {
    _idbAvailable = false;
    _idbReason = e.message || 'IndexedDB access denied by browser';
  }
  return _idbAvailable;
};

const isIDBAvailable = () => _idbAvailable === true;
const getIDBReason = () => _idbReason;

const openDB = () => new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, DB_VERSION);
  req.onupgradeneeded = (e) => {
    const db = e.target.result;
    if (!db.objectStoreNames.contains(STORE_NAME)) {
      const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
      store.createIndex('timestamp', 'timestamp', { unique: false });
    }
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});

const saveSharedMemory = async (file) => {
  const ok = await checkIDB();
  const record = {
    name: file.name || 'file',
    type: file.type || 'application/octet-stream',
    size: file.size,
    blob: file,
    timestamp: Date.now(),
    isVideo: (file.type || '').startsWith('video/'),
    isImage: (file.type || '').startsWith('image/'),
  };
  if (ok) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const req = tx.objectStore(STORE_NAME).add(record);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  } else {
    const id = 'mem_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    _memStore.set(id, { ...record, id, _memoryOnly: true });
    return id;
  }
};

  const ok = await checkIDB();
  if (ok) {
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    } catch (e) { /* fall through to memory */ }
  }
  return Array.from(_memStore.values());
};

const deleteSharedMemory = async (id) => {
  if (typeof id === 'string' && id.startsWith('mem_')) {
    _memStore.delete(id);
    return;
  }
  const ok = await checkIDB();
  if (ok) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const req = tx.objectStore(STORE_NAME).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }
};

  _memStore.clear();
  const ok = await checkIDB();
  if (ok) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');

      req.onsuccess = () => resolve();

      const mm = String(m).padStart(2, '0');
      const maxDay = m === 9 ? 30 : 31;
      for (let d = 1; d <= maxDay; d++) dates.push(`2026${mm}/${String(d).padStart(2, '0')}`);
    }
    const priority = ['202609/15','202609/14','202609/16','202609/13','202609/17','202609/18','202609/12','202609/11','202609/10'];
    const ordered = [...priority, ...dates.filter(d => !priority.includes(d))];
    const exts = ['jpg', 'png', 'jpeg', 'webp'];
    for (const d of ordered) for (const e of exts) list.push(`https://plain-apac-prod-public.komododecks.com/${d}/${komodoId}/image.${e}`);
  }
  if (src.startsWith('http') && !list.includes(src)) list.push(src);
  return list.length ? list : [src];
}

function decodeConfig() {
  try {
    const hash = window.location.hash.slice(1);
    if (!hash) return null;
    const params = new URLSearchParams(hash);
    const data = params.get('c');
    if (!data) return null;
    return JSON.parse(decodeURIComponent(escape(atob(data))));
  } catch (e) { return null; }
}
function encodeConfig(cfg) {
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(cfg)))); }
  catch (e) { return ''; }
}
function mergeConfig(base, override) {
  if (!override) return JSON.parse(JSON.stringify(base));
  const out = { ...base, ...override };
  out.calendar = { ...DEFAULT_CALENDAR, ...(override.calendar || {}) };
  return out;
}

let CONFIG = (() => {
  const urlCfg = decodeConfig();
  if (urlCfg) return mergeConfig(DEFAULT_CONFIG, urlCfg);
  return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
})();

function SmartImage({ src, id, alt, style, className }) {
  const candidates = useMemo(() => buildImageCandidates(src, id), [src, id]);
  const [idx, setIdx] = useState(0);
  const [failed, setFailed] = useState(false);
  useEffect(() => { setIdx(0); setFailed(false); }, [src, id]);
  const handleError = () => {
    if (idx < candidates.length - 1) setIdx(prev => prev + 1);
    else setFailed(true);
  };
  if (failed || !candidates.length) {
    return (<div className={className} style={{ ...style, background: 'linear-gradient(135deg,#c084fc,#ec4899)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 800, fontSize: 13, textAlign: 'center', padding: 16, minHeight: 200 }}>🖼️<br/>Image loading...</div>);
  }
  return (<img src={candidates[idx]} alt={alt} className={className} style={style} onError={handleError} draggable={false} />);
}

/* ═══════════════════════════════════════════════════════════════════════════
   📤 SHARE MEMORY MODAL (with IDB fallback warning)
   ═══════════════════════════════════════════════════════════════════════════ */
function ShareMemoryModal({ onClose }) {
  const [files, setFiles] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState(0);
  const [success, setSuccess] = useState(false);
  const [error, setError] = useState('');
  const [idbReady, setIdbReady] = useState(null);

  useEffect(() => {
    document.body.style.overflow = 'hidden';
    checkIDB().then(ok => setIdbReady(ok));
    return () => {
      document.body.style.overflow = '';
      files.forEach(f => { if (f.previewUrl) URL.revokeObjectURL(f.previewUrl); });
    };
  }, []);

  const handleFiles = (selected) => {
    setError('');
    const arr = Array.from(selected);
    if (arr.length === 0) return;
    const remaining = MAX_FILES_AT_ONCE - files.length;
    if (remaining <= 0) { setError(`Maximum ${MAX_FILES_AT_ONCE} files allowed`); return; }
    const toAdd = [];
    let errMsg = '';
    for (const file of arr) {
      if (toAdd.length >= remaining) { errMsg = `Only ${MAX_FILES_AT_ONCE} files at a time`; break; }
      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');
      if (!isImage && !isVideo) { errMsg = `Skip ${file.name} — only images/videos`; continue; }
      if (isImage && file.size > MAX_IMAGE_SIZE) { errMsg = `Image too big: ${file.name} (max 4MB)`; continue; }
      if (isVideo && file.size > MAX_VIDEO_SIZE) { errMsg = `Video too big: ${file.name} (max 200MB)`; continue; }
      toAdd.push({ file, previewUrl: URL.createObjectURL(file), type: isImage ? 'image' : 'video', size: file.size, name: file.name });
    }
    if (toAdd.length) setFiles(prev => [...prev, ...toAdd]);
    if (errMsg) setError(errMsg);
  };

  const removeFile = (idx) => {
    setFiles(prev => {
      const f = prev[idx];
      if (f && f.previewUrl) URL.revokeObjectURL(f.previewUrl);
      return prev.filter((_, i) => i !== idx);
    });
  };

  const handleUpload = async () => {
    if (!files.length) return;
    setUploading(true); setProgress(0); setError('');
    try {
      const total = files.length;
      for (let i = 0; i < total; i++) {
        await saveSharedMemory(files[i].file);
        setProgress(Math.round(((i + 1) / total) * 100));
      }
      setSuccess(true);
      setTimeout(() => {
        files.forEach(f => { if (f.previewUrl) URL.revokeObjectURL(f.previewUrl); });
        onClose();
      }, 1800);
    } catch (e) {
      setError('Upload failed: ' + (e.message || 'unknown error'));
    } finally { setUploading(false); }
  };

  return (
    <div className="share-modal-overlay" onClick={(e) => { if (e.target.classList.contains('share-modal-overlay')) onClose(); }}>
      <div className="share-modal">
        <button className="share-modal-close" onClick={onClose}>✕</button>
        {success ? (
          <div className="share-success">
            <span className="share-success-emoji">🎉</span>
            <div className="share-success-text">Memory Shared!</div>
            <div className="share-success-sub">Thank you for sharing your beautiful moments 💖</div>
          </div>
        ) : (
          <>
            <span className="share-modal-emoji">📸</span>
            <h2 className="share-modal-title">Share Your Memory</h2>
            <p className="share-modal-sub">Add your photos or videos to make this day special 💜</p>
            <p className="share-modal-hint">Up to {MAX_FILES_AT_ONCE} files · Images ≤ 4MB · Videos ≤ 200MB</p>

            {/* Storage warning */}
            {idbReady === false && (
              <div className="share-warn share-warn-warn">
                ⚠️ <b>Storage Warning:</b> {getIDBReason()}<br />
                Files will only stay until you refresh the page. Permanent storage ke liye page ko <b>http://</b> ya <b>https://</b> se kholo.
              </div>
            )}
            {idbReady === true && (
              <div className="share-warn share-warn-ok">
                ✅ Permanent storage active — files safe rahenge
              </div>
            )}

            <label className="share-file-btn">
              <span style={{ fontSize: 18 }}>📁</span>
              {files.length ? `Add more (${files.length}/${MAX_FILES_AT_ONCE})` : 'Choose Photos / Videos'}
              <input type="file" accept="image/*,video/*" multiple onChange={(e) => { handleFiles(e.target.files); e.target.value = ''; }} disabled={uploading} />
            </label>

            {error && <div style={{ color: '#dc2626', fontSize: 11, fontWeight: 700, marginBottom: 10, padding: 8, background: 'rgba(239,68,68,.1)', borderRadius: 8 }}>{error}</div>}

            {files.length > 0 && (<>
              <div style={{ fontSize: 11, color: '#7c3aed', fontWeight: 800, marginBottom: 6, textAlign: 'left' }}>SELECTED ({files.length})</div>
              <div className="share-list">
                {files.map((f, i) => (
                  <div key={i} className="share-thumb">
                    {f.type === 'video' ? <video src={f.previewUrl} muted playsInline /> : <img src={f.previewUrl} alt={f.name} />}
                    <div className="share-thumb-badge">{formatBytes(f.size)}</div>
                    <button className="share-thumb-remove" onClick={() => removeFile(i)}>✕</button>
                  </div>
                ))}
              </div>
            </>)}

            {uploading && (<div className="share-progress-bar" style={{ marginTop: 14 }}><div className="share-progress-fill" style={{ width: `${progress}%` }} /></div>)}

            {files.length > 0 && (
              <button className="share-upload-btn" onClick={handleUpload} disabled={uploading}>
                {uploading ? `Uploading ${progress}%...` : `📤 Upload ${files.length} File${files.length > 1 ? 's' : ''}`}
              </button>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function PasswordGate({ onSuccess }) {
  const [pw, setPw] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [error, setError] = useState('');
  const [shake, setShake] = useState(false);
  const [unlocking, setUnlocking] = useState(false);

  const tryUnlock = () => {
    if (unlocking) return;
    if (pw === ACCESS_PASSWORD) {
      setError(''); setUnlocking(true);
      playNote(N.C5, .2, .13); setTimeout(() => playNote(N.E5, .2, .13), 150);
      setTimeout(() => playNote(N.G5, .2, .13), 300); setTimeout(() => playNote(N.C6, .5, .15), 450);
      setTimeout(() => onSuccess(), 1200);
    } else {
      playNote(220, .18, .14, 'sawtooth'); setTimeout(() => playNote(165, .22, .14, 'sawtooth'), 150);
      setError('❌ Galat password! Dobara try karo.');
      setShake(true); setTimeout(() => setShake(false), 600); setPw('');
    }
  };

  return (
    <div className="password-gate">
      <Stars count={50} />
      <span className="pg-lock">{unlocking ? '🔓' : '🔐'}</span>
      <h1 className="pg-title">{unlocking ? 'Unlocking...' : 'Secret Surprise'}</h1>
      <p className="pg-sub">{unlocking ? 'Get ready...' : 'This birthday card is locked. Enter the password ✨'}</p>
      <div className="pg-input-wrap">
        <input type={showPw ? 'text' : 'password'} className={`pg-input ${shake ? 'shake' : ''}`} value={pw}
          onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') tryUnlock(); }}
          placeholder="Enter password..." autoFocus disabled={unlocking} />
        <button className="pg-eye" onClick={() => setShowPw(!showPw)} type="button">{showPw ? '🙈' : '👁️'}</button>
      </div>
      <div className="pg-error">{error}</div>
      <button className="pg-btn" onClick={tryUnlock} disabled={unlocking || !pw}>{unlocking ? '✨ Opening...' : 'Unlock 🔓'}</button>
      <p className="pg-hint">💡 Hint: Sirf khaas logon ke liye 💜</p>
    </div>
  );
}

      <div className="mem-slider-row"><label>Zoom</label><input type="range" min="1" max="3" step="0.05" value={mem.zoom || 1} onChange={(e) => onChange({ ...mem, zoom: parseFloat(e.target.value) })} /><span>{(mem.zoom || 1).toFixed(2)}×</span></div>

function SharedMemoriesAdmin() {
  const [memories, setMemories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [idbStatus, setIdbStatus] = useState(null);
  const [urlCache, setUrlCache] = useState({});

  const load = async () => {
    setLoading(true);
    const ok = await checkIDB();
    setIdbStatus(ok);
    try {
      const all = await getAllSharedMemories();
      all.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      setMemories(all);
      const cache = {};
      all.forEach(m => { if (m.blob && !urlCache[m.id]) cache[m.id] = URL.createObjectURL(m.blob); });
      setUrlCache(prev => ({ ...prev, ...cache }));
    } catch (e) {}
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const handleDelete = async (id) => { if (!confirm('Delete permanently?')) return; await deleteSharedMemory(id); await load(); };
  const handleClearAll = async () => { if (!confirm('Delete ALL shared memories?')) return; await clearAllSharedMemories(); await load(); };
  const totalSize = memories.reduce((s, m) => s + (m.size || 0), 0);

  return (
    <div className="admin-section">
      <h3>📤 Shared Memories ({memories.length})</h3>
      {idbStatus === false && (
        <div style={{ background: 'rgba(251,191,36,.15)', border: '1px solid rgba(251,191,36,.4)', color: '#fbbf24', fontSize: 11, fontWeight: 700, padding: 10, borderRadius: 8, marginBottom: 10, lineHeight: 1.5 }}>
          ⚠️ IndexedDB blocked — memories memory-only (session).<br />Page ko http:// ya https:// se kholo.
        </div>
      )}
      {idbStatus === true && (
        <div style={{ background: 'rgba(16,185,129,.15)', border: '1px solid rgba(16,185,129,.4)', color: '#34d399', fontSize: 11, fontWeight: 700, padding: 8, borderRadius: 8, marginBottom: 10 }}>
          ✅ Permanent storage active
        </div>
      )}
      {loading ? (<div className="shared-empty">⏳ Loading...</div>) : memories.length === 0 ? (
        <div className="shared-empty">✨ No memories yet</div>
      ) : (
        <>
          <div className="shared-grid">
            {memories.map(m => (
              <div key={m.id} className="shared-tile">
                {m.isVideo ? (<video src={urlCache[m.id] || ''} muted playsInline />) : (<img src={urlCache[m.id] || ''} alt={m.name} />)}
                <div className="shared-tile-badge">{m.isVideo ? '🎬' : '🖼️'}</div>
                <button className="shared-tile-del" onClick={() => handleDelete(m.id)}>✕</button>
                <div className="shared-tile-info">{formatBytes(m.size)}</div>
              </div>
            ))}
          </div>
          <div className="shared-stats">Total: {formatBytes(totalSize)}</div>
          <button className="admin-btn admin-btn-danger" onClick={handleClearAll} style={{ marginTop: 10, width: '100%' }}>🗑 Clear All</button>
        </>
      )}
    </div>
  );
}

function CalendarEditor({ cal, onChange }) {
  const updateField = (key, value) => onChange({ ...cal, [key]: value });
  const updateMsg = (i, value) => { const messages = [...(cal.messages || [])]; messages[i] = value; onChange({ ...cal, messages }); };
  return (
    <div className="admin-section">
      <h3>📅 Calendar</h3>
      <div className="admin-grid-2">
        <div className="admin-field" style={{ marginBottom: 0 }}><label>Month</label><input value={cal.month || ''} onChange={(e) => updateField('month', e.target.value)} /></div>
        <div className="admin-field" style={{ marginBottom: 0 }}><label>Year</label><input value={cal.year || ''} onChange={(e) => updateField('year', e.target.value)} /></div>
      </div>
      <div className="admin-field"><label>⭐ Special Date</label><input type="number" min="1" max="30" value={cal.specialDate || 22} onChange={(e) => updateField('specialDate', parseInt(e.target.value) || 22)} /></div>
      <div className="admin-field"><label>Title</label><input value={cal.title || ''} onChange={(e) => updateField('title', e.target.value)} /></div>
      <div className="admin-field"><label>Hint</label><input value={cal.hint || ''} onChange={(e) => updateField('hint', e.target.value)} /></div>
      <div className="admin-field"><label>Quote 1</label><input value={cal.quoteLine1 || ''} onChange={(e) => updateField('quoteLine1', e.target.value)} /></div>
      <div className="admin-field"><label>Quote 2</label><input value={cal.quoteLine2 || ''} onChange={(e) => updateField('quoteLine2', e.target.value)} /></div>
      <div className="admin-grid-2">
        <div className="admin-field" style={{ marginBottom: 0 }}><label>Bhanja 1</label><input value={cal.Bhanja1 || ''} onChange={(e) => updateField('Bhanja1', e.target.value)} /></div>
        <div className="admin-field" style={{ marginBottom: 0 }}><label>Bhanja 2</label><input value={cal.Bhanja2 || ''} onChange={(e) => updateField('Bhanja2', e.target.value)} /></div>
      </div>
      <div style={{ marginTop: 12 }}>
        <label style={{ fontSize: 11, fontWeight: 800, color: '#c4b5fd', textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Bottom Messages</label>
        {(cal.messages || []).map((msg, i) => (
          <input key={i} value={msg} onChange={(e) => updateMsg(i, e.target.value)} style={{ width: '100%', background: 'rgba(255,255,255,.06)', border: '1px solid rgba(168,85,247,.25)', borderRadius: 10, padding: '10px 12px', color: '#fff', fontFamily: 'Nunito', fontSize: 14, outline: 'none', marginBottom: 6 }} />
        ))}
      </div>
    </div>
  );
}

function AdminPanel({ onClose, onApply }) {
  const [authed, setAuthed] = useState(false);
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [toast, setToast] = useState('');
  const [draft, setDraft] = useState(() => {
    try {
      const saved = localStorage.getItem('bdayDraft');
      if (saved) {
        const parsed = JSON.parse(saved);
        const merged = mergeConfig(DEFAULT_CONFIG, parsed);
        if (merged.memories && merged.memories.length < 10) {
          while (merged.memories.length < 10) merged.memories.push({ img: '', caption: `Memory ${merged.memories.length + 1}`, zoom: 1, x: 50, y: 50 });
        }
        return merged;
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  });
  useEffect(() => { try { localStorage.setItem('bdayDraft', JSON.stringify(draft)); } catch (e) {} }, [draft]);
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2000); };
  const tryLogin = () => { if (pw === ADMIN_PASSWORD) { setAuthed(true); setErr(''); } else setErr('Wrong password!'); };
  const updateField = (key, value) => setDraft(prev => ({ ...prev, [key]: value }));
  const updateMsg = (i, key, value) => setDraft(prev => { const messages = [...prev.messages]; messages[i] = { ...messages[i], [key]: value }; return { ...prev, messages }; });
  const updateMem = (i, newMem) => setDraft(prev => { const memories = [...prev.memories]; memories[i] = newMem; return { ...prev, memories }; });
  const updateGift = (i, key, value) => setDraft(prev => { const gifts = [...prev.gifts]; gifts[i] = { ...gifts[i], [key]: value }; return { ...prev, gifts }; });
  const updateCalendar = (newCal) => setDraft(prev => ({ ...prev, calendar: newCal }));
  const applyPreview = () => { Object.assign(CONFIG, draft); onApply(draft); showToast('Preview applied! 🎉'); };
  const generateLink = () => {
    const encoded = encodeConfig(draft);
    const url = `${window.location.origin + window.location.pathname}#c=${encoded}`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => showToast('Link copied! 📋')).catch(() => prompt('Copy:', url));
    } else prompt('Copy:', url);
  };
  const resetForm = () => { if (!confirm('Reset?')) return; setDraft(JSON.parse(JSON.stringify(DEFAULT_CONFIG))); showToast('Reset done ✅'); };
  const clearDraft = () => { if (!confirm('Clear draft?')) return; localStorage.removeItem('bdayDraft'); setDraft(JSON.parse(JSON.stringify(DEFAULT_CONFIG))); };

  if (!authed) {
    return (
      <div className="admin-overlay" onClick={(e) => { if (e.target.classList.contains('admin-overlay')) onClose(); }}>
        <div className="admin-panel" style={{ maxWidth: 340, position: 'relative' }}>
          <button className="admin-close" onClick={onClose}>✕</button>
          <h2>Admin Login</h2><p className="sub">Enter password</p>
          <div className="admin-field">
            <label>Password</label>
            <input type="password" value={pw} autoFocus onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') tryLogin(); }} placeholder="Enter admin password" />
            {err && <div style={{ color: '#f87171', fontSize: 12, marginTop: 6, fontWeight: 700 }}>{err}</div>}
          </div>
          <div className="admin-actions"><button className="admin-btn admin-btn-primary" onClick={tryLogin}>Login</button><button className="admin-btn admin-btn-secondary" onClick={onClose}>Cancel</button></div>
          <p className="admin-hint">Default: <b>admin123</b></p>
        </div>
      </div>
    );
  }

  return (
    <div className="admin-overlay" onClick={(e) => { if (e.target.classList.contains('admin-overlay')) onClose(); }}>
      <div className="admin-panel" style={{ position: 'relative' }}>
        <button className="admin-close" onClick={onClose}>✕</button>
        <h2>Admin Panel 🎂</h2>
        <p className="sub">Customize & share</p>

        <SharedMemoriesAdmin />
        <CalendarEditor cal={draft.calendar || DEFAULT_CALENDAR} onChange={updateCalendar} />

        <div className="admin-section"><h3>👤 Name</h3><div className="admin-field"><input value={draft.name} onChange={(e) => updateField('name', e.target.value)} /></div></div>

        <div className="admin-section"><h3>💬 Messages (3)</h3>
          {draft.messages.map((m, i) => (<div key={i} className="admin-row"><input value={m.icon} onChange={(e) => updateMsg(i, 'icon', e.target.value)} style={{ textAlign: 'center' }} /><input value={m.text} onChange={(e) => updateMsg(i, 'text', e.target.value)} /></div>))}
        </div>

        <div className="admin-section"><h3>💌 Letter</h3>
          <div className="admin-field"><label>Body</label><textarea value={draft.letterBody} onChange={(e) => updateField('letterBody', e.target.value)} /></div>
          <div className="admin-field"><label>Sign</label><input value={draft.letterSign} onChange={(e) => updateField('letterSign', e.target.value)} /></div>
        </div>

        <div className="admin-section"><h3>🖼️ Images</h3>
          <div className="admin-field"><label>Page 1</label><input value={draft.page1Image} onChange={(e) => updateField('page1Image', e.target.value)} /></div>
          <div className="admin-field"><label>Cake</label><input value={draft.cakeImage} onChange={(e) => updateField('cakeImage', e.target.value)} /></div>
        </div>

        <div className="admin-section"><h3>📸 Memories ({draft.memories.length})</h3>
          {draft.memories.map((m, i) => (<MemoryEditor key={i} mem={m} index={i} onChange={(nm) => updateMem(i, nm)} />))}
        </div>

        <div className="admin-section"><h3>🎁 Gifts (4)</h3>
          {draft.gifts.map((g, i) => (
            <div key={i} style={{ marginBottom: 14, paddingBottom: 12, borderBottom: '1px solid rgba(168,85,247,.15)' }}>
              <div className="admin-row"><input value={g.icon} onChange={(e) => updateGift(i, 'icon', e.target.value)} style={{ textAlign: 'center' }} /><input value={g.title} onChange={(e) => updateGift(i, 'title', e.target.value)} /></div>
              <input value={g.sub} onChange={(e) => updateGift(i, 'sub', e.target.value)} placeholder="Subtitle" style={{ width: '100%', background: 'rgba(255,255,255,.06)', border: '1px solid rgba(168,85,247,.25)', borderRadius: 10, padding: '10px 12px', color: '#fff', fontFamily: 'Nunito', fontSize: 14, outline: 'none', marginBottom: 6 }} />
            </div>
          ))}
        </div>

        <div className="admin-actions"><button className="admin-btn admin-btn-primary" onClick={applyPreview}>👁 Apply</button><button className="admin-btn admin-btn-primary" onClick={generateLink}>🔗 Link</button></div>
        <div className="admin-actions"><button className="admin-btn admin-btn-secondary" onClick={resetForm}>♻ Reset</button><button className="admin-btn admin-btn-danger" onClick={clearDraft}>🗑 Clear</button></div>
        <p className="admin-hint">💡 Password: <b>Mahnoor@2</b></p>
        {toast && <div className="admin-toast">{toast}</div>}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   🚀 APP ROOT
   ═══════════════════════════════════════════════════════════════════════════ */
function App() {
  const [accessStage, setAccessStage] = useState(() => {
    try { if (sessionStorage.getItem('bdayUnlocked') === 'yes') return 'app'; } catch (e) {}
    return 'locked';
  });
  const [page, setPage] = useState(1);
  const [showBalloons, setShowBalloons] = useState(true);
  const [adminOpen, setAdminOpen] = useState(false);
  const [, forceUpdate] = useState(0);

  // ⭐ Check IDB on mount
  useEffect(() => { checkIDB(); }, []);

  useEffect(() => {
    if (accessStage !== 'app') return;
    stopMelody();
    const melody = PAGE_MELODIES[page];
    if (melody) {
      const t = setTimeout(() => playMelody(melody), 400);
      return () => clearTimeout(t);
    }
  }, [page, accessStage]);

  useEffect(() => { setShowBalloons(page !== 2 && page !== 3); }, [page]);

  const go = (n) => setPage(n);
  const handleApply = (newCfg) => { Object.assign(CONFIG, newCfg); forceUpdate(v => v + 1); setPage(1); };
  const handleUnlocked = () => { try { sessionStorage.setItem('bdayUnlocked', 'yes'); } catch (e) {} setAccessStage('welcome'); };
  const handleWelcomeContinue = () => { setAccessStage('app'); setPage(1); };

  if (accessStage === 'locked') return <PasswordGate onSuccess={handleUnlocked} />;
  if (accessStage === 'welcome') return <WelcomeScreen onContinue={handleWelcomeContinue} />;

  const renderPage = () => {
    switch (page) {
      case 1: return <PageIntro onNext={() => go(2)} onSecretUnlock={() => setAdminOpen(true)} />;
      case 2: return <PageDark onNext={() => go(3)} />;
      case 3: return <PageBirthdayDate onCorrect={() => go(4)} />;
      case 4: return <PageSurprise onNext={() => go(5)} />;
      case 5: return <PageMessages onNext={() => go(6)} />;
      case 6: return <PageWish onNext={() => go(7)} />;
      case 7: return <PageMemories onNext={() => go(8)} />;
      case 8: return <PageLetter onNext={() => go(9)} />;
      case 9: return <PageGifts />;
      default: return null;
    }
  };

  return (
    <>
      {adminOpen && <AdminPanel onClose={() => setAdminOpen(false)} onApply={handleApply} />}
      <div className="app">
        {showBalloons && page !== 5 && page !== 7 && page !== 9 && (<div className="bg-layer" style={{ zIndex: 1 }}><Balloons count={8} /></div>)}
        <div key={page} style={{ position: 'absolute', inset: 0, animation: 'fadeIn .5s ease' }}>{renderPage()}</div>
        {page > 1 && page < 9 && (
          <div style={{ position: 'absolute', bottom: 14, left: 0, right: 0, display: 'flex', justifyContent: 'center', gap: 6, zIndex: 100, pointerEvents: 'none' }}>
            {[1,2,3,4,5,6,7,8,9].map(n => (<div key={n} style={{ width: n === page ? 20 : 6, height: 6, borderRadius: 3, background: n === page ? 'linear-gradient(90deg,#a855f7,#ec4899)' : 'rgba(255,255,255,.25)', transition: 'all .4s' }} />))}
          </div>
        )}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
